[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "iris-analyzer"
version = "0.1.0"
description = "Evidence-backed deterministic deployment analysis with an isolated OpenCode adapter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1", "jsonschema>=4.23,<5", "PyYAML>=6.0.2,<7",
  "tree-sitter>=0.25,<0.26", "tree-sitter-javascript>=0.25,<0.26",
  "tree-sitter-typescript>=0.23.2,<0.24", "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-cov>=6,<7", "ruff>=0.11,<1"]

[project.scripts]
iris-analyzer = "iris_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
iris_analyzer = ["schemas/*.json", "opencode/prompts/*.txt", "opencode/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
