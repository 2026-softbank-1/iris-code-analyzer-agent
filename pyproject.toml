[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "iris-analyzer"
version = "0.1.0"
description = "Evidence-backed deterministic deployment analysis with an isolated OpenCode adapter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1", "jsonschema>=4.23,<5", "PyYAML>=6.0.2,<7",
  "tree-sitter>=0.25,<0.26", "tree-sitter-javascript>=0.25,<0.26",
  "tree-sitter-typescript>=0.23.2,<0.24", "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-cov>=6,<7", "ruff>=0.11,<1"]
demo = ["fastapi>=0.142.2,<1", "uvicorn>=0.54,<1"]

[project.scripts]
iris-analyzer = "iris_analyzer.cli:main"
iris-review-demo = "iris_analyzer.demo.app:main"
iris-deployment = "iris_analyzer.deployment.cli:main"
iris-measure = "iris_analyzer.deployment.measure:main"
iris-build-prepare = "iris_analyzer.build.cli:main"
iris-organization = "iris_analyzer.organization.cli:main"
iris-analysis-gate = "iris_analyzer.gate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
iris_analyzer = ["schemas/*.json", "opencode/prompts/*.txt", "opencode/*.json", "demo/static/*", "deployment/catalogs/*.json", "deployment/templates/**/*", "deployment/templates/terraform/aws_eks/.terraform.lock.hcl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
