name: iris-multi-image-shop
services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      target: runtime
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "127.0.0.1:${WEB_PORT:-8088}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      target: runtime
    command: ["npm", "start"]
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-iris_demo}:${POSTGRES_PASSWORD:-iris_demo_local}@postgres:5432/${POSTGRES_DB:-iris_shop}
      REDIS_URL: redis://redis:6379
      ORDER_QUEUE_NAME: order-processing
      LOG_LEVEL: info
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "src/healthcheck.js"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
      target: runtime
    command: ["npm", "start"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-iris_demo}:${POSTGRES_PASSWORD:-iris_demo_local}@postgres:5432/${POSTGRES_DB:-iris_shop}
      REDIS_URL: redis://redis:6379
      ORDER_QUEUE_NAME: order-processing
      WORKER_CONCURRENCY: "2"
      HEALTH_PORT: "3001"
      OUTBOX_POLL_MS: "5000"
      LOG_LEVEL: info
    expose:
      - "3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "src/healthcheck.js"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iris_shop}
      POSTGRES_USER: ${POSTGRES_USER:-iris_demo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iris_demo_local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/002-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
